services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: sis-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=informationSystem
    networks:
      - sis-network

  # Backend API
  backend:
    build:
      context: ./backend-
      dockerfile: Dockerfile.dev
    container_name: sis-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/informationSystem
    env_file:
      - ./backend-/.env
    depends_on:
      - mongodb
    networks:
      - sis-network
    volumes:
      - ./backend-:/app
      - /app/node_modules
    command: npm run dev

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sis-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_BASE=http://localhost:5000/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - sis-network
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true

networks:
  sis-network:
    driver: bridge

volumes:
  mongodb_data:
  frontend_node_modules:
